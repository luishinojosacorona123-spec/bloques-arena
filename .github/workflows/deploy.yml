name: bloques-ci-cd
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r server/requirements.txt flask pytest
      - run: cd server && pytest -q
      - run: cd serverless && pytest -q
  publish:
    if: github.event_name != 'pull_request' && vars.WIF_PROVIDER != '' && vars.CI_SERVICE_ACCOUNT != '' && vars.GCP_PROJECT != ''
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Publicar imágenes por SHA
        env: {PROJECT: '${{ vars.GCP_PROJECT }}'}
        run: |
          docker build -t us-central1-docker.pkg.dev/$PROJECT/bloques/server:$GITHUB_SHA server
          docker push us-central1-docker.pkg.dev/$PROJECT/bloques/server:$GITHUB_SHA
          docker build -t us-central1-docker.pkg.dev/$PROJECT/bloques/leaderboard:$GITHUB_SHA serverless
          docker push us-central1-docker.pkg.dev/$PROJECT/bloques/leaderboard:$GITHUB_SHA
  deploy:
    needs: publish
    # Runner propio dentro de admin_cidrs; entorno protegido con aprobación.
    runs-on: [self-hosted, linux, bloques-deploy]
    environment: production
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: bloques-dev
          location: us-central1-a
          project_id: ${{ vars.GCP_PROJECT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Actualizar plantilla de la flota
        env: {PROJECT: '${{ vars.GCP_PROJECT }}', SCORES_URL: '${{ vars.LEADERBOARD_URL }}'}
        run: |
          test -n "$SCORES_URL"
          sed -i "s/REPLACE_PROJECT/$PROJECT/g; s/REPLACE_SHA/$GITHUB_SHA/g" k8s/fleet.yaml k8s/serviceaccount.yaml
          kubectl apply -f k8s/serviceaccount.yaml -f k8s/sdk-rbac.yaml
          sed "/name: AGONES_ENABLED/a\                - {name: LEADERBOARD_URL, value: \"$SCORES_URL\"}" k8s/fleet.yaml > fleet-rendered.yaml
          kubectl apply -f fleet-rendered.yaml -f k8s/autoscaler.yaml
          kubectl get fleet bloques-fleet -o wide
          gcloud run services update bloques-dev-scores --region us-central1 --image us-central1-docker.pkg.dev/$PROJECT/bloques/leaderboard:$GITHUB_SHA --quiet
      # No se afirma un canary medido: validar antes en staging y adjuntar evidencia.

